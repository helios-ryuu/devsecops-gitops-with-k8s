name: Nightly Active GHCR & Base Image Audit

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      severity:
        description: "Ngưỡng mức độ CVE để cảnh báo/fail"
        required: false
        default: "HIGH,CRITICAL"
        type: string

jobs:
  nightly-ghcr-image-scan:
    name: Nightly Active Image CVE Audit (0 MB Cluster RAM)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      REGISTRY: ${{ vars.CONTAINER_REGISTRY || 'ghcr.io' }}
      MANIFEST_FILES: ${{ vars.NIGHTLY_SCAN_MANIFESTS || 'project-nt548/k8s-manifests/deployment.yaml project-nt548/k8s-manifests/redis-statefulset.yaml' }}
      TRIVY_SEVERITY: ${{ inputs.severity || vars.TRIVY_SEVERITY || 'HIGH,CRITICAL' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Trivy
        uses: aquasecurity/setup-trivy@v0.3.1

      - name: Pull Active Deployed Images & Run Trivy Scan
        run: |
          IMAGES=$(python3 -c '
          import os, re
          imgs = []
          for path in os.environ["MANIFEST_FILES"].split():
              txt = open(path).read()
              imgs.extend(re.findall(r"image:\s+(\S+)", txt))
          print("\n".join(dict.fromkeys(imgs)))
          ')
          if [ -z "$IMAGES" ]; then
            echo "Error: No active images extracted for Trivy scan"
            exit 1
          fi
          echo "Active deployed images to scan (severity: ${TRIVY_SEVERITY}):"
          echo "$IMAGES"
          for IMG in $IMAGES; do
            echo "=== Pulling & Scanning $IMG ==="
            docker pull "$IMG"
            trivy image --severity "$TRIVY_SEVERITY" --ignore-unfixed --exit-code 1 "$IMG"
          done
