name: Nightly Active GHCR & Base Image Audit

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      severity:
        description: "Ngưỡng mức độ CVE để fail"
        default: "HIGH,CRITICAL"
        type: string

defaults:
  run:
    shell: bash

jobs:
  nightly-ghcr-image-scan:
    name: Nightly Active Image CVE Audit (0 MB Cluster RAM)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      REGISTRY: ${{ vars.CONTAINER_REGISTRY || 'ghcr.io' }}
      MANIFEST_FILES: ${{ vars.NIGHTLY_SCAN_MANIFESTS || 'project-nt548/k8s-manifests/deployment.yaml project-nt548/k8s-manifests/redis-statefulset.yaml' }}
      SEVERITY: ${{ inputs.severity || vars.TRIVY_SEVERITY || 'HIGH,CRITICAL' }}
    steps:
      - uses: actions/checkout@v6

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: aquasecurity/setup-trivy@v0.3.1

      - name: Pull & Scan Active Images (yq + Trivy)
        run: |
          read -r -a FILES <<< "$MANIFEST_FILES"
          mapfile -t IMAGES < <(yq eval-all --no-doc '.. | .image? | select(. != null and . != "")' "${FILES[@]}" | sort -u)
          [[ "${#IMAGES[@]}" -gt 0 ]] || { echo "No active images found" >&2; exit 1; }
          for IMG in "${IMAGES[@]}"; do
            echo "=== Pulling & Scanning $IMG ==="
            docker pull "$IMG"
            trivy image --severity "$SEVERITY" --ignore-unfixed --exit-code 1 "$IMG"
          done
