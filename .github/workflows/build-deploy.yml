name: Build, Trivy Image Gate & GitOps Deploy

on:
  workflow_call:
    inputs:
      context: { type: string, default: "./app" }
      deployment_file: { type: string, default: "project-nt548/k8s-manifests/deployment.yaml" }
      severity: { type: string, default: "HIGH,CRITICAL" }
      push_and_deploy: { type: boolean, default: false }
      target_branch: { type: string, default: "main" }
    secrets:
      GITOPS_TOKEN: { required: false }

defaults:
  run:
    shell: bash

jobs:
  build-and-deploy:
    name: 4. Build, Trivy Image Gate & Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      REGISTRY: ${{ vars.CONTAINER_REGISTRY || 'ghcr.io' }}
      FULL_IMAGE: ${{ vars.CONTAINER_REGISTRY || 'ghcr.io' }}/${{ github.repository }}:${{ github.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ inputs.push_and_deploy && secrets.GITOPS_TOKEN || github.token }}

      - uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        if: ${{ inputs.push_and_deploy }}
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker Image (Local Scan)
        uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.context }}/Dockerfile
          load: true
          tags: ${{ env.FULL_IMAGE }}

      - name: Render GitOps Manifest (yq)
        env:
          DEPLOYMENT_FILE: ${{ inputs.deployment_file }}
          SHORT_SHA: ${{ github.sha }}
        run: |
          export SHORT_SHA="${SHORT_SHA:0:8}"
          yq -i '(.spec.template.spec.containers[0].image) = strenv(FULL_IMAGE) | (.spec.template.spec.containers[0].env[] | select(.name == "APP_VERSION").value) = strenv(SHORT_SHA)' "$DEPLOYMENT_FILE"

      - uses: aquasecurity/setup-trivy@v0.3.1

      - name: Trivy Image Scan (Security Gate)
        env:
          DEPLOYMENT_FILE: ${{ inputs.deployment_file }}
          SEVERITY: ${{ inputs.severity }}
        run: |
          MANIFEST_DIR="$(dirname "$DEPLOYMENT_FILE")"
          mapfile -t IMAGES < <(yq eval-all --no-doc '.. | .image? | select(. != null and . != "")' "$MANIFEST_DIR"/*.yaml | sort -u)
          [[ "${#IMAGES[@]}" -gt 0 ]] || { echo "No images found in $MANIFEST_DIR" >&2; exit 1; }
          FAILED=0
          for IMG in "${IMAGES[@]}"; do
            echo "=== Scanning $IMG ==="
            if ! trivy image --severity "$SEVERITY" --ignore-unfixed --exit-code 1 "$IMG"; then
              echo "::error::Vulnerabilities detected in $IMG"
              FAILED=1
            fi
          done
          exit "$FAILED"

      - name: Push Docker Image
        if: ${{ inputs.push_and_deploy }}
        uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.context }}/Dockerfile
          push: true
          tags: ${{ env.FULL_IMAGE }}

      - name: Commit & Push GitOps Manifest
        if: ${{ inputs.push_and_deploy }}
        env:
          DEPLOYMENT_FILE: ${{ inputs.deployment_file }}
          TARGET_BRANCH: ${{ inputs.target_branch }}
        run: |
          git config --local user.name "GitHub Actions"
          git config --local user.email "action@github.com"
          git add "$DEPLOYMENT_FILE"
          git diff --cached --quiet || { git commit -m "chore(prod): update image tag to ${GITHUB_SHA} [skip ci]" && git pull --rebase origin "$TARGET_BRANCH" && git push origin "HEAD:${TARGET_BRANCH}"; }
