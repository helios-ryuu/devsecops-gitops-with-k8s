name: DevSecOps Security Gates

on:
  workflow_call:
    inputs:
      app_dir:
        description: "Thư mục mã nguồn ứng dụng cần quét Trivy FS"
        type: string
        default: "app"
      kubeconform_paths:
        description: "Danh sách thư mục manifest Kubernetes cần validate (phân cách bằng dấu cách)"
        type: string
        default: "project-nt548/k8s-manifests platform-core/kyverno/policies platform-core/monitoring/servicemonitors"
      trivy_config_path:
        description: "Thư mục manifest cần quét misconfiguration bằng Trivy Config"
        type: string
        default: "project-nt548/k8s-manifests"
      severity:
        description: "Ngưỡng mức độ nghiêm trọng CVE/Config để chặn pipeline"
        type: string
        default: "HIGH,CRITICAL"
      ignore_unfixed:
        description: "Bỏ qua các CVE chưa có bản vá"
        type: boolean
        default: true
      kubeconform_version:
        description: "Phiên bản kubeconform CLI"
        type: string
        default: "0.6.7"

jobs:
  secret-scan:
    name: 1. Secret Scanning (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  vulnerability-scan:
    name: 2. Source CVE Scanning (Trivy FS)
    needs: secret-scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Trivy FS Scan (Dependencies)
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          scan-type: "fs"
          scan-ref: ${{ inputs.app_dir }}
          severity: ${{ inputs.severity }}
          exit-code: "1"
          ignore-unfixed: ${{ inputs.ignore_unfixed }}

  manifest-security-gate:
    name: 3. Kubernetes Manifest & Config Gate
    needs: secret-scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Install kubeconform
        env:
          KUBECONFORM_VERSION: ${{ inputs.kubeconform_version }}
        run: |
          curl -sSL "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | tar -xz -C /tmp kubeconform
          sudo mv /tmp/kubeconform /usr/local/bin/kubeconform

      - name: Validate Kubernetes Manifests (kubeconform)
        env:
          KUBECONFORM_PATHS: ${{ inputs.kubeconform_paths }}
        run: |
          read -r -a PATHS <<< "$KUBECONFORM_PATHS"
          kubeconform -strict -ignore-missing-schemas -summary "${PATHS[@]}"

      - name: Trivy Config Scan (Kubernetes Manifests)
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          scan-type: "config"
          scan-ref: ${{ inputs.trivy_config_path }}
          severity: ${{ inputs.severity }}
          exit-code: "1"
