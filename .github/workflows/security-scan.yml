name: DevSecOps Security Gates

on:
  workflow_call:
    inputs:
      app_dir: { type: string, default: "app" }
      manifest_paths: { type: string, default: "project-nt548/k8s-manifests platform-core/kyverno/policies platform-core/monitoring/servicemonitors" }
      trivy_config_path: { type: string, default: "project-nt548/k8s-manifests" }
      severity: { type: string, default: "HIGH,CRITICAL" }

defaults:
  run:
    shell: bash

jobs:
  secret-scan:
    name: 1. Secret Scanning (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  vulnerability-scan:
    name: 2. Source CVE Scanning (Trivy FS)
    needs: secret-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: aquasecurity/setup-trivy@v0.3.1
      - name: Trivy FS Scan
        env:
          APP_DIR: ${{ inputs.app_dir }}
          SEVERITY: ${{ inputs.severity }}
        run: trivy fs --severity "$SEVERITY" --ignore-unfixed --exit-code 1 "$APP_DIR"

  manifest-security-gate:
    name: 3. Kubernetes Manifest & Config Gate
    needs: secret-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate Manifests (kubeconform)
        env:
          MANIFEST_PATHS: ${{ inputs.manifest_paths }}
          KUBECONFORM_VERSION: ${{ vars.KUBECONFORM_VERSION || '0.6.7' }}
        run: |
          curl -sSL "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin kubeconform
          read -r -a PATHS <<< "$MANIFEST_PATHS"
          kubeconform -strict -ignore-missing-schemas -summary "${PATHS[@]}"
      - uses: aquasecurity/setup-trivy@v0.3.1
      - name: Trivy Config Scan
        env:
          CONFIG_PATH: ${{ inputs.trivy_config_path }}
          SEVERITY: ${{ inputs.severity }}
        run: trivy config --severity "$SEVERITY" --exit-code 1 "$CONFIG_PATH"
