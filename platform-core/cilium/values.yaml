# ==============================================================================
# HELM VALUES: CILIUM EBPF CNI, KUBE-PROXY REPLACEMENT, LB & HUBBLE UI
# Chart: cilium/cilium (https://helm.cilium.io/)
# Install:
#   helm repo add cilium https://helm.cilium.io/ && helm repo update
#   helm install cilium cilium/cilium -n kube-system -f platform-core/cilium/values.yaml
# ==============================================================================

kubeProxyReplacement: true
k8sServiceHost: "10.100.0.1"
k8sServicePort: "6443"

# Bắt traffic Ingress từ Public IP (eth0/en*) và overlay nội bộ cụm (wg0)
devices: "eth+,en+,wg0"

ipam:
  mode: kubernetes

routingMode: tunnel
tunnelProtocol: vxlan
MTU: 1340

# Cụm dùng Traefik xử lý L7 (Ingress/TLS) và chỉ dùng NetworkPolicy L3/L4 -> tắt Envoy để tiết kiệm RAM
l7Proxy: false
envoy:
  enabled: false

l2announcements:
  enabled: false

operator:
  replicas: 1
  resources:
    requests:
      cpu: "50m"
      memory: "64Mi"
    limits:
      cpu: "250m"
      memory: "192Mi"

resources:
  requests:
    cpu: "100m"
    memory: "192Mi"
  limits:
    cpu: "500m"
    memory: "512Mi"

# Bật serviceMonitor=true bằng `helm upgrade` sau khi Prometheus CRDs sẵn sàng ở Pha 4
prometheus:
  enabled: true
  serviceMonitor:
    enabled: false
    labels:
      release: monitoring

hubble:
  enabled: true
  metrics:
    enabled:
      - dns
      - drop
      - tcp
      - flow
    serviceMonitor:
      enabled: false
      labels:
        release: monitoring
  relay:
    enabled: true
    affinity: &workerAffinity
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: node-role.kubernetes.io/control-plane
                  operator: DoesNotExist
    resources:
      requests:
        cpu: "25m"
        memory: "32Mi"
      limits:
        cpu: "100m"
        memory: "128Mi"
  ui:
    enabled: true
    affinity: *workerAffinity
    backend:
      resources:
        requests:
          cpu: "15m"
          memory: "32Mi"
        limits:
          cpu: "100m"
          memory: "96Mi"
    frontend:
      resources:
        requests:
          cpu: "15m"
          memory: "24Mi"
        limits:
          cpu: "100m"
          memory: "64Mi"
    ingress:
      enabled: true
      className: traefik
      annotations:
        traefik.ingress.kubernetes.io/router.entrypoints: websecure
      hosts:
        - hubble.helios.id.vn
