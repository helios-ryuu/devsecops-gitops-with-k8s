# ==============================================================================
# HELM VALUES: KYVERNO POLICY ENGINE (CHART 3.10.0 / APP v1.20.0, NON-HA)
# Chart: kyverno/kyverno (https://kyverno.github.io/kyverno/)
# Install:
#   helm repo add kyverno https://kyverno.github.io/kyverno/ && helm repo update
#   helm install kyverno kyverno/kyverno --version 3.10.0 -n kyverno --create-namespace -f platform-core/kyverno/values.yaml
# ==============================================================================

# Khóa toàn bộ Pod & Hook Jobs của Kyverno về 2 Worker onprem-lan (tự giữ kubernetes.io/os: linux)
global:
  nodeSelector:
    topology.kubernetes.io/zone: onprem-lan

# Tắt các tính năng report & background scan để đồng bộ với reportsController.enabled=false
features:
  admissionReports:
    enabled: false
  aggregateReports:
    enabled: false
  policyReports:
    enabled: false
  validatingAdmissionPolicyReports:
    enabled: false
  backgroundScan:
    enabled: false

admissionController:
  replicas: 1
  container:
    resources:
      requests:
        cpu: "75m"
        memory: "160Mi"
      limits:
        # Không đặt limits.cpu (theo mặc định chart) để tránh CPU throttling làm chậm Admission Webhook
        memory: "384Mi"

backgroundController:
  enabled: false

cleanupController:
  enabled: false

reportsController:
  enabled: false
