# Mẫu SealedSecret cho Grafana Admin (sinh bằng lệnh kubeseal trong platform-core/sealed-secrets/README.md)
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: grafana-admin-secret
  namespace: monitoring
spec:
  encryptedData:
    admin-user: "<ENCRYPTED_ADMIN_USER_BY_KUBESEAL>"
    admin-password: "<ENCRYPTED_ADMIN_PASSWORD_BY_KUBESEAL>"
  template:
    metadata:
      name: grafana-admin-secret
      namespace: monitoring
    type: Opaque
