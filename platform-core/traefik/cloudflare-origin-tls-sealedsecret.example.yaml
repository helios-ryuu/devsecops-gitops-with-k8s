# Mẫu SealedSecret cho Cloudflare Origin TLS (sinh bằng lệnh kubeseal trong platform-core/sealed-secrets/README.md)
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: cloudflare-origin-tls
  namespace: traefik
spec:
  encryptedData:
    tls.crt: "<ENCRYPTED_TLS_CRT_BY_KUBESEAL>"
    tls.key: "<ENCRYPTED_TLS_KEY_BY_KUBESEAL>"
  template:
    metadata:
      name: cloudflare-origin-tls
      namespace: traefik
    type: kubernetes.io/tls
