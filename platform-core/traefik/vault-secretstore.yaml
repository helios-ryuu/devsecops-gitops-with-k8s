apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-vault-auth
  namespace: traefik
automountServiceAccountToken: false
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault-backend
  namespace: traefik
spec:
  provider:
    vault:
      server: "http://vault.vault.svc.cluster.local:8200"
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "eso-traefik"
          serviceAccountRef:
            name: "eso-vault-auth"
