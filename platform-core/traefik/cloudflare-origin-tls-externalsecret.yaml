apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare-origin-tls
  namespace: traefik
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: cloudflare-origin-tls
    creationPolicy: Owner
    template:
      type: kubernetes.io/tls
  data:
    - secretKey: tls.crt
      remoteRef:
        key: traefik/cloudflare-origin-tls
        property: tls.crt
    - secretKey: tls.key
      remoteRef:
        key: traefik/cloudflare-origin-tls
        property: tls.key
