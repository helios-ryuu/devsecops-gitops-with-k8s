apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: redis-auth-secret
  namespace: app-prod
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: redis-auth-secret
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: app-prod/redis-auth
        property: password
