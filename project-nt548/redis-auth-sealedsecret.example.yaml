# Mẫu SealedSecret cho Redis Auth trong app-prod (sinh bằng kubeseal rồi lưu vào project-nt548/k8s-manifests/redis-auth-sealedsecret.yaml để ArgoCD đồng bộ)
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: redis-auth-secret
  namespace: app-prod
spec:
  encryptedData:
    password: "<ENCRYPTED_REDIS_PASSWORD_BY_KUBESEAL>"
  template:
    metadata:
      name: redis-auth-secret
      namespace: app-prod
    type: Opaque
