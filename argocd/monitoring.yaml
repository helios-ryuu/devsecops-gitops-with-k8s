apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  # Sử dụng tính năng Multiple Sources: 1 source lấy Helm chart từ repo ngoài, 1 source lấy values.yaml từ Git
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 92.17.1
      helm:
        valueFiles:
          - $values/monitoring/values.yaml
    - repoURL: https://github.com/helios-ryuu/devsecops-gitops-with-k8s.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true # Bắt buộc cho Prometheus CRDs dung lượng lớn

