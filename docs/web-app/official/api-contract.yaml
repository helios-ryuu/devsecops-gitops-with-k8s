# Official Documentation — giữ nguyên wire contract từ practical-test.
# Xem README.md và FRD.md để phân biệt current code với proposed target.
openapi: 3.1.1
info:
  title: AI Agent Office Monitor — Operational API
  version: 0.1.0
  description: >-
    Contract HTTP độc lập framework, dùng để phát triển và review Web App.
    Health và success body của readiness giữ code-observed Next handlers.
    Redis-aware readiness/503 và metrics là target proposed, chưa runtime-verified.
    Counter API còn BLOCKED Q-101/Q-103. Access boundary còn Q-102;
    tài liệu Official không tự phê duyệt public exposure hoặc deployment.
