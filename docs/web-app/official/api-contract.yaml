x-wire-rules:
- GET does not mutate business visits.
- Required response fields non-null; totals decimal strings, timestamps UTC RFC3339 Z.
- Registration JSON request rejects unknown fields; response additional fields allowed for compatible additions.
- No visitor identity/IP/cookie/session-based uniqueness is claimed. UUID is request identity, not a user/account.
- No promise of exactly-once beyond600s, state loss, expired/evicted dedup or unverified recovery.
- No pagination,agent CRUD,event ingestion,auth or simulator-control API; Reset Demo is browser-local.
- Rate limits/max body/operational access-denial wire handling remain Platform/Web design details; no numeric defaults
  asserted.
x-optional-streaming:
  status: deferred
  rationale: SSE/shared history not selected for V1/V2; no replay/retained event promise.
x-validation:
  checked-scope: Document checks recorded in README.md after execution; examples synthetic.
  unchecked-scope: Runtime, Redis atomicity/persistence/fault injection, live ingress/probes/scrape, Prometheus
    parser integration, simulator and migration.
paths:
  /api/visits:
    get:
      operationId: getVisitorCount
      x-fr-ids:
      - FR-101
      x-delivery-stages:
      - V1
      - V2
      x-access-class: viewer
      x-implementation: target design; not runtime-tested
      summary: Đọc tổng page views, không increment
      description: Chỉ đọc total đã initialized. Không tạo counter khi missing, không biến Redis error thành0. Response
        total là snapshot tại thời điểm đọc.
      responses:
        '200':
          description: Tổng đã biết; decimal string để không mất chính xác.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisitorTotal'
              example:
                total: '123'
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
              description: Không cache business receipt/counter hoặc probe state.
        '500':
          description: Lỗi ứng dụng đã được sanitize.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Error'
                - type: object
                  properties:
                    error:
                      type: object
                      properties:
                        code:
                          enum:
                          - INTERNAL_ERROR
              examples:
                INTERNAL_ERROR:
                  value:
                    error:
                      code: INTERNAL_ERROR
                      message: Lỗi ứng dụng đã được sanitize.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
              description: Không cache business receipt/counter hoặc probe state.
        '503':
          description: Counter chưa khả dụng hoặc chưa initialized theo authority được chốt.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Error'
                - type: object
                  properties:
                    error:
                      type: object
                      properties:
                        code:
                          enum:
                          - COUNTER_UNAVAILABLE
                          - COUNTER_NOT_INITIALIZED
              examples:
                COUNTER_UNAVAILABLE:
                  value:
                    error:
                      code: COUNTER_UNAVAILABLE
                      message: Counter chưa khả dụng hoặc chưa initialized theo authority được chốt.
                COUNTER_NOT_INITIALIZED:
                  value:
                    error:
                      code: COUNTER_NOT_INITIALIZED
                      message: Counter chưa khả dụng hoặc chưa initialized theo authority được chốt.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
              description: Không cache business receipt/counter hoặc probe state.
    post:
      operationId: registerPageView
      x-fr-ids:
      - FR-101
      x-delivery-stages:
      - V1
      - V2
      x-access-class: viewer
      x-implementation: target design; not runtime-tested
      summary: Ghi nhận một page view bằng requestId
      description: Mỗi document load/F5 tạo UUID mới. Hydration/re-render/retry cùng load dùng cùng requestId. Commit
        counter+dedup atomic. Retry cùng ID trong cửa sổ600s trả receipt gốc, không increment; retry không refresh
        expiry. Không tạo ID mới chỉ để retry lỗi. Hết cửa sổ hoặc mất Redis dedup state không bảo đảm duplicate
        protection; client dừng automatic retry sau600s tính từ lần gửi đầu và báo outcome unknown. Probe/metrics/static/Reset
        Demo không gọi registration. Không thu identity người dùng.
      x-idempotency:
        identity-field: requestId
        retention-seconds: 600
        total-expiry: null
        refresh-on-retry: false
        replay-total: original receipt total, not latest global total
        scope: site/environment; Redis state and retention window intact
        after-window: Do not automatically reuse stale IDs; server cannot distinguish expired duplicate from new
          ID.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PageViewRequest'
            example:
              requestId: e409d9b9-971c-4a88-81e4-dd728a61946d
      responses:
        '200':
          description: Registration thành công hoặc replay receipt trong window. Total là snapshot tại original
            registration; GET đọc total mới nhất.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageViewReceipt'
              examples:
                newPageView:
                  value:
                    requestId: e409d9b9-971c-4a88-81e4-dd728a61946d
                    total: '124'
                    replayed: false
                retrySameRequest:
                  value:
                    requestId: e409d9b9-971c-4a88-81e4-dd728a61946d
                    total: '124'
                    replayed: true
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
              description: Không cache business receipt/counter hoặc probe state.
        '400':
          description: Body phải đúng PageViewRequest, requestId UUID hợp lệ, không additional fields.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Error'
                - type: object
                  properties:
                    error:
                      type: object
                      properties:
                        code:
                          enum:
                          - INVALID_REQUEST
              examples:
                INVALID_REQUEST:
                  value:
                    error:
                      code: INVALID_REQUEST
                      message: Body phải đúng PageViewRequest, requestId UUID hợp lệ, không additional fields.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
              description: Không cache business receipt/counter hoặc probe state.
        '500':
          description: Exception không dự kiến; không lộ stack/Redis host/secret.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Error'
                - type: object
                  properties:
                    error:
                      type: object
                      properties:
                        code:
                          enum:
                          - INTERNAL_ERROR
              examples:
                INTERNAL_ERROR:
                  value:
                    error:
                      code: INTERNAL_ERROR
                      message: Exception không dự kiến; không lộ stack/Redis host/secret.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
              description: Không cache business receipt/counter hoặc probe state.
        '503':
          description: Dependency hoặc outcome chưa xác định. Không reset, không blind retry bằng ID mới. Limit/initialization
            policy còn Platform/Web xác nhận.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Error'
                - type: object
                  properties:
                    error:
                      type: object
                      properties:
                        code:
                          enum:
                          - COUNTER_UNAVAILABLE
                          - COUNTER_NOT_INITIALIZED
                          - VISIT_OUTCOME_UNKNOWN
                          - COUNTER_LIMIT_REACHED
              examples:
                COUNTER_UNAVAILABLE:
                  value:
                    error:
                      code: COUNTER_UNAVAILABLE
                      message: Dependency hoặc outcome chưa xác định. Không reset, không blind retry bằng ID mới.
                        Limit/initialization policy còn Platform/Web xác nhận.
                COUNTER_NOT_INITIALIZED:
                  value:
                    error:
                      code: COUNTER_NOT_INITIALIZED
                      message: Dependency hoặc outcome chưa xác định. Không reset, không blind retry bằng ID mới.
                        Limit/initialization policy còn Platform/Web xác nhận.
                VISIT_OUTCOME_UNKNOWN:
                  value:
                    error:
                      code: VISIT_OUTCOME_UNKNOWN
                      message: Dependency hoặc outcome chưa xác định. Không reset, không blind retry bằng ID mới.
                        Limit/initialization policy còn Platform/Web xác nhận.
                COUNTER_LIMIT_REACHED:
                  value:
                    error:
                      code: COUNTER_LIMIT_REACHED
                      message: Dependency hoặc outcome chưa xác định. Không reset, không blind retry bằng ID mới.
                        Limit/initialization policy còn Platform/Web xác nhận.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
              description: Không cache business receipt/counter hoặc probe state.
  /healthz:
    get:
      operationId: getLiveness
      x-fr-ids:
      - FR-102
      x-delivery-stages:
      - V1
      - V2
      x-access-class: infra-or-authorized-admin
      x-implementation: 200 handler code-observed; target access enforcement not tested
      summary: Kiểm tra process, không phụ thuộc Redis
      description: GET không mutate business data. Process không trả lời do caller phát hiện timeout; không hứa
        JSON khi process chết.
      responses:
        '200':
          description: Process còn đáp ứng.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Liveness'
              example:
                status: ok
                uptime: 12.5
                timestamp: '2026-11-06T00:00:00.000Z'
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
              description: Không cache business receipt/counter hoặc probe state.
  /ready:
    get:
      operationId: getReadiness
      x-fr-ids:
      - FR-103
      x-delivery-stages:
      - V1
      - V2
      x-access-class: infra-or-authorized-admin
      x-implementation: target design; not runtime-tested
      summary: Kiểm tra init/config, Redis dependency và drain
      x-redis-timeout-seconds: 2
      x-kubernetes-probe-timeout-seconds: 3
      x-startup-budget-seconds: 50
      description: Target:200 khi initialized/config hợp lệ, Redis check thành công trong tối đa2s và chưa drain.
        Tổng response phải đủ margin trước readiness probe timeout3s. Redis retry không kéo dài check quá2s. Startup
        budget khoảng50s bằng startupProbe, không cộng thành Redis timeout. Check depth PING hay kiểm quyền command
        còn Platform/Web xác nhận; không tạo/reset counter hoặc dedup keys. Current Next /ready vẫn always200; target
        chưa implemented. Khi NotReady, routing tới cả UI/API Next có thể bị ngắt.
      responses:
        '200':
          description: Điều kiện phục vụ đạt tại thời điểm check.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'
              example:
                status: ready
                timestamp: '2026-11-06T00:00:00.000Z'
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
              description: Không cache business receipt/counter hoặc probe state.
        '503':
          description: Redis check lỗi/timeout2s hoặc app initializing/missing config/draining. Không lộ dependency
            address.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Error'
                - type: object
                  properties:
                    error:
                      type: object
                      properties:
                        code:
                          enum:
                          - DEPENDENCY_UNAVAILABLE
                          - NOT_READY
              examples:
                DEPENDENCY_UNAVAILABLE:
                  value:
                    error:
                      code: DEPENDENCY_UNAVAILABLE
                      message: Redis check lỗi/timeout2s hoặc app initializing/missing config/draining. Không lộ
                        dependency address.
                NOT_READY:
                  value:
                    error:
                      code: NOT_READY
                      message: Redis check lỗi/timeout2s hoặc app initializing/missing config/draining. Không lộ
                        dependency address.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
              description: Không cache business receipt/counter hoặc probe state.
  /metrics:
    get:
      operationId: getApplicationMetrics
      x-fr-ids:
      - FR-104
      x-delivery-stages:
      - V1
      - V2
      x-access-class: infra-or-authorized-admin
      x-implementation: target design; not runtime-tested
      summary: Xuất bốn metric families của V1
      x-metric-catalog:
      - name: web_app_process_uptime_seconds
        type: gauge
        unit: seconds
        labels: []
        source: monotonic process lifetime
      - name: web_app_http_requests_total
        type: counter
        unit: requests
        labels:
        - method
        - route
        - status_code
        source: completed HTTP requests per process; includes operational requests, not business visit count
      - name: web_app_http_request_duration_seconds
        type: histogram
        unit: seconds
        labels:
        - method
        - route
        source: completed HTTP response duration measured by monotonic clock; bucket boundaries TBD Q-106
        derived:
        - bucket/le
        - sum
        - count
      - name: web_app_redis_up
        type: gauge
        unit: boolean 0/1
        labels: []
        source: last completed bounded dependency observation;1 success,0 failure/timeout or before success; no
          business counter read; freshness measurement Q-106
      description: 'Prometheus text exposition0.0.4, per-process registry. Redis down không chặn export HTTP/process
        series; redis_up phản ánh bounded check gần nhất, không promise tức thời. Scrape qua Service có thể thất
        bại khi readiness rút Nextpod: Platform cần scrape target phù hợp. Không xuất thêm CPU/RAM/Kubernetes metrics
        ở app; dùng hạ tầng sẵn có. Không đọc business total hoặc tạo visits để scrape. Histogram sample chỉ minh
        họa +Inf; production buckets phải được QA chốt. Method từ allowlist+OTHER, route từ registered templates+unmatched,
        status_code valid HTTP; không raw URL/query,requestId,agent/taskID,credential hoặc free text.'
      responses:
        '200':
          description: Registry process còn phục vụ; các số liệu example là synthetic, không traffic đã đo.
          headers:
            Content-Type:
              schema:
                type: string
                const: text/plain; version=0.0.4; charset=utf-8
              description: Exposition format đã chọn.
          content:
            text/plain:
              schema:
                type: string
                minLength: 1
              example: |
                # HELP web_app_process_uptime_seconds Process uptime in seconds.
                # TYPE web_app_process_uptime_seconds gauge
                web_app_process_uptime_seconds 12.5
                # HELP web_app_http_requests_total Completed HTTP requests.
                # TYPE web_app_http_requests_total counter
                web_app_http_requests_total{method="GET",route="/healthz",status_code="200"} 1
                # HELP web_app_http_request_duration_seconds Completed HTTP request duration.
                # TYPE web_app_http_request_duration_seconds histogram
                web_app_http_request_duration_seconds_bucket{method="GET",route="/healthz",le="+Inf"} 1
                web_app_http_request_duration_seconds_sum{method="GET",route="/healthz"} 0.01
                web_app_http_request_duration_seconds_count{method="GET",route="/healthz"} 1
                # HELP web_app_redis_up Last bounded dependency observation.
                # TYPE web_app_redis_up gauge
                web_app_redis_up 1
        '503':
          description: Registry không khả dụng; Redis down đơn thuần không là lý do trả503 metrics.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Error'
                - type: object
                  properties:
                    error:
                      type: object
                      properties:
                        code:
                          enum:
                          - METRICS_UNAVAILABLE
              examples:
                METRICS_UNAVAILABLE:
                  value:
                    error:
                      code: METRICS_UNAVAILABLE
                      message: Registry không khả dụng; Redis down đơn thuần không là lý do trả503 metrics.
components:
  schemas:
    UtcTimestamp:
      type: string
      format: date-time
      pattern: Z$
      description: UTC timestamp; examples are synthetic, not observed traffic.
    Liveness:
      type: object
      required:
      - status
      - uptime
      - timestamp
      additionalProperties: true
      properties:
        status:
          type: string
          const: ok
        uptime:
          type: number
          minimum: 0
          description: Seconds since process start, possibly fractional.
        timestamp:
          $ref: '#/components/schemas/UtcTimestamp'
    Readiness:
      type: object
      required:
      - status
      - timestamp
      additionalProperties: true
      properties:
        status:
          type: string
          const: ready
        timestamp:
          $ref: '#/components/schemas/UtcTimestamp'
    VisitorTotal:
      type: object
      required:
      - total
      additionalProperties: true
      properties:
        total:
          type: string
          pattern: ^(0|[1-9][0-9]*)$
          description: Exact decimal total, nonnegative, no JS/PHP numeric coercion; initialized0 is valid, dependency
            failure is not0.
    PageViewRequest:
      type: object
      required:
      - requestId
      additionalProperties: false
      properties:
        requestId:
          type: string
          format: uuid
          description: Generated once per document load; preserved for retries; new F5 gets new UUID.
    PageViewReceipt:
      type: object
      required:
      - requestId
      - total
      - replayed
      additionalProperties: true
      properties:
        requestId:
          type: string
          format: uuid
        total:
          type: string
          pattern: ^(0|[1-9][0-9]*)$
          description: Total recorded at original registration; repeated ID returns this original total.
        replayed:
          type: boolean
          description: False for first committed registration; true when original receipt replayed without increment.
    Error:
      type: object
      required:
      - error
      additionalProperties: true
      properties:
        error:
          type: object
          required:
          - code
          - message
          additionalProperties: true
          properties:
            code:
              type: string
              enum:
              - INVALID_REQUEST
              - COUNTER_UNAVAILABLE
              - COUNTER_NOT_INITIALIZED
              - VISIT_OUTCOME_UNKNOWN
              - COUNTER_LIMIT_REACHED
              - DEPENDENCY_UNAVAILABLE
              - NOT_READY
              - METRICS_UNAVAILABLE
              - INTERNAL_ERROR
            message:
              type: string
              minLength: 1
              description: Sanitized human-readable text; clients branch on code; no Redis host,stack or secret.
