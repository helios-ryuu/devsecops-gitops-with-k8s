  title: AI Agent Office Monitor — V1/V2 API
  version: 0.2.0
  description: Target contract theo E-109; Next Fullstack UI và server APIs, Redis riêng, không Express release.
    Document1.1.0 không là implementation/acceptance evidence. V1/V2 cùng operational/counter contracts; Office
    simulator browser-local không có agents/tasks HTTP API.
