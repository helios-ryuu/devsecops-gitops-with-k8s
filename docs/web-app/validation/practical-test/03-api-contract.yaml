info:
  title: AI Agent Office Monitor — operational contract draft
  version: 0.1.0
  description: >-
    DRAFT framework-independent partial contract. Health and successful readiness
    bodies preserve code-observed Next handlers. Dependency-aware readiness and
    metrics are proposed. This is not an approved public-access or deployment contract.
