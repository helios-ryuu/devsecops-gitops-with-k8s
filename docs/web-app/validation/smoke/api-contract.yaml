# SANDBOX: partial code-observed probe contract, not an accepted business API.
openapi: 3.1.1
info:
  title: NT548 — hợp đồng thử nghiệm hai probes
  version: 0.1.0
  description: >-
    Draft từ handlers tại project commit 2110eddec91bc3e34137c86fef693095c4afb677.
    Chỉ mô tả request đã tới GET handler và response JSON do handler tạo;
    không chứng minh HTTP/runtime hoặc ingress access policy. Counter và metrics
    chưa có contract được xác lập. Examples là dữ liệu tổng hợp, không phải log chạy.
