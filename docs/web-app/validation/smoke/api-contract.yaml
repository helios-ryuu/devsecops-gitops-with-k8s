paths:
  /healthz:
    get:
      operationId: getHealth
      x-fr-ids: [FR-02]
      x-rule-ids: [RULE-02]
      x-ac-ids: [AC-03, AC-04]
      x-evidence-refs: [E-05]
      x-implementation: code-observed; not runtime-tested
      x-commitment: proposed
      summary: Báo cáo tiến trình ở handler health
      description: >-
        Uptime tính bằng giây từ process.uptime(), timestamp từ new Date().toISOString().
        Không đọc Redis; không xác lập trạng thái các dependency hoặc toàn bộ hệ thống.
      responses:
        '200':
          description: Handler tạo JSON health khi nhận được GET.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthReport'
              example:
                status: ok
                uptime: 12.5
                timestamp: '2026-11-05T00:00:00.000Z'
  /ready:
    get:
      operationId: getReadiness
      x-fr-ids: [FR-03]
      x-rule-ids: [RULE-03]
      x-ac-ids: [AC-05, AC-06]
      x-evidence-refs: [E-06]
      x-implementation: code-observed; not runtime-tested
      x-commitment: proposed
      summary: Báo cáo ready theo handler hiện tại
      description: >-
        Trả ready/200 mà không kiểm tra Redis. Không có 503 do Redis failure trong
        handler được đọc. Desired semantics cần Q-03 trước khi thay contract.
      responses:
        '200':
          description: Handler tạo JSON ready khi nhận được GET; không chứng minh dependency-ready.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessReport'
              example:
                status: ready
                timestamp: '2026-11-05T00:00:00.000Z'
components:
  schemas:
    HealthReport:
      type: object
      additionalProperties: false
      required: [status, uptime, timestamp]
      properties:
        status:
          type: string
          enum: [ok]
        uptime:
          type: number
          minimum: 0
          description: Giây sống của process tại thời điểm handler gọi, có thể là số thập phân.
        timestamp:
          type: string
          format: date-time
          pattern: 'Z$'
          description: UTC ISO string do handler tạo; không phải persisted event timestamp.
    ReadinessReport:
      type: object
      additionalProperties: false
      required: [status, timestamp]
      properties:
        status:
          type: string
          enum: [ready]
        timestamp:
          type: string
          format: date-time
          pattern: 'Z$'
          description: UTC ISO string do handler tạo; không phải Redis health status.
