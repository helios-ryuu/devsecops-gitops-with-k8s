      change: Hai operations code-observed; không thêm endpoint nghiệp vụ hoặc readiness 503.
      affected-ids: [FR-02, FR-03, getHealth, getReadiness]
  security-decision: >-
    Không thấy authentication/authorization trong hai handlers. Chính sách expose
    ở proxy/cluster và target authorization TBD Q-04. Không coi thiếu security scheme
    trong lát cắt này là phê duyệt public access hoặc bằng chứng perimeter không có auth.
  compatibility: >-
    Không đề xuất breaking change. Thêm dependency-aware readiness, đổi status/body
    hoặc chuyển owner sang Express phải review consumers/probes và contracts trước.
