# ==============================================================================
# KUBEADM INIT & CLUSTER CONFIG — server-01 (VPS Control Plane)
# Target: Kubernetes v1.37.1 (kubeadm.k8s.io/v1beta4) + WireGuard wg0 + Cilium eBPF
# Path trên server-01: /etc/kubernetes/kubeadm-init.yaml
# ==============================================================================
apiVersion: kubeadm.k8s.io/v1beta4
kind: InitConfiguration
skipPhases:
  - addon/kube-proxy
localAPIEndpoint:
  advertiseAddress: "10.100.0.1"
  bindPort: 6443
nodeRegistration:
  name: "server-01"
  criSocket: "unix:///run/containerd/containerd.sock"
  kubeletExtraArgs:
    - name: "node-ip"
      value: "10.100.0.1"
---
apiVersion: kubeadm.k8s.io/v1beta4
kind: ClusterConfiguration
kubernetesVersion: "v1.37.1"
controlPlaneEndpoint: "10.100.0.1:6443"
networking:
  podSubnet: "10.42.0.0/16"
  serviceSubnet: "10.43.0.0/16"
apiServer:
  certSANs:
    - "10.100.0.1"
    - "<VPS_PUBLIC_IP>"
    - "vps.helios.id.vn"
    - "server-01"
    - "127.0.0.1"
    - "localhost"
  extraArgs:
    - name: "encryption-provider-config"
      value: "/etc/kubernetes/enc/enc.yaml"
  extraVolumes:
    - name: "encryption-conf"
      hostPath: "/etc/kubernetes/enc"
      mountPath: "/etc/kubernetes/enc"
      readOnly: true
      pathType: DirectoryOrCreate
---
apiVersion: kubelet.config.k8s.io/v1beta1
kind: KubeletConfiguration
cgroupDriver: systemd
